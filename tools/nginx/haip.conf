# Nginx config for haip.kr
# 위치: /etc/nginx/conf.d/haip.conf
# 적용: sudo cp tools/nginx/haip.conf /etc/nginx/conf.d/haip.conf && sudo nginx -t && sudo systemctl reload nginx
# 주의: certbot 이 HTTPS 블록을 관리하므로, cp 후 certbot 설정이 덮어써질 수 있음
#
# 웹 루트는 저장소 루트가 아니라 빌드 결과물(dist/)이다.
# 저장소 루트를 그대로 서빙하면 .git/, CLAUDE.md, deploy.sh 가 전부 공개된다.
# dist/ 에는 주석을 제거한 HTML 만 들어가고 나머지는 서빙 대상 밖에 있다.

server {
    listen 80;
    server_name haip.kr www.haip.kr;
    # $host 가 아니라 haip.kr 로 고정 — www 요청이 한 번에 정규 주소로 간다
    return 301 https://haip.kr$request_uri;
}

server {
    # nginx 1.25 부터 listen 의 http2 파라미터는 폐기됐다 (경고만 내고 동작은 함).
    # 별도 지시자로 분리해야 한다.
    listen 443 ssl;
    http2 on;
    server_name haip.kr www.haip.kr;

    # www 는 apex 로 301. 안 넘기면 같은 문서가 두 호스트에서 200 으로 응답해
    # 색인이 갈리고 링크 신호도 쪼개진다. canonical 만으로는 힌트에 그친다.
    # server 컨텍스트의 if + return 은 nginx 가 권장하는 안전한 사용법이다.
    if ($host = www.haip.kr) {
        return 301 https://haip.kr$request_uri;
    }

    ssl_certificate /etc/letsencrypt/live/haip.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haip.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/haip/dist;
    index index.html;

    server_tokens off;

    # 이미지, 영상, 문서는 저장소의 assets/ 를 그대로 쓴다 (dist 로 복사하지 않음)
    # ^~ 가 반드시 필요하다. 일반 prefix 로 두면 아래 확장자 regex 블록이 이겨서
    # root 가 dist 로 돌아가고 /assets/*.png 가 전부 404 가 된다.
    location ^~ /assets/ {
        root /var/www/haip;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # CSS, JS 는 dist 안에 빌드된 것을 쓴다
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }

    # 방어선 하나 더 — dist 밖이라 닿을 일이 없지만 실수로 루트가 바뀌어도 막히게
    location ~ /\.                          { deny all; access_log off; log_not_found off; }
    location ~* \.(md|sh|py|conf|pem|key|ya?ml|log|bak|orig)$ { deny all; access_log off; log_not_found off; }

    # 구버전 URL — 예전에 쓰던 주소를 새 주소로 넘긴다.
    # meta refresh 스텁 파일 대신 301 로 처리한다 (신호가 제대로 넘어가고 루트도 깨끗하다)
    location = /brand-story.html      { return 301 /services.html#process; }
    location = /brand-story           { return 301 /services.html#process; }
    location = /insight-case.html     { return 301 /insight.html#case; }
    location = /insight-guide.html    { return 301 /insight.html#guide; }
    location = /insight-glossary.html { return 301 /insight/glossary/index.html; }
    location = /about.html      { return 301 /services.html; }
    location = /about           { return 301 /services.html; }
    location = /portfolio.html  { return 301 /services.html; }
    location = /portfolio       { return 301 /services.html; }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Strict-Transport-Security "max-age=31536000" always;
}
