# Nginx config for haip.kr
# 위치: /etc/nginx/conf.d/haip.conf
# 적용: sudo cp tools/nginx/haip.conf /etc/nginx/conf.d/haip.conf && sudo nginx -t && sudo systemctl reload nginx
# 주의: certbot 이 HTTPS 블록을 관리하므로, cp 후 certbot 설정이 덮어써질 수 있음
#
# 웹 루트는 저장소 루트가 아니라 빌드 결과물(dist/)이다.
# 저장소 루트를 그대로 서빙하면 .git/, CLAUDE.md, deploy.sh 가 전부 공개된다.
# dist/ 에는 주석을 제거한 HTML 만 들어가고 나머지는 서빙 대상 밖에 있다.

server {
    listen 80;
    server_name haip.kr www.haip.kr;
    # $host 가 아니라 haip.kr 로 고정 — www 요청이 한 번에 정규 주소로 간다
    return 301 https://haip.kr$request_uri;
}

server {
    # nginx 1.25 부터 listen 의 http2 파라미터는 폐기됐다 (경고만 내고 동작은 함).
    # 별도 지시자로 분리해야 한다.
    listen 443 ssl;
    http2 on;
    server_name haip.kr www.haip.kr;

    # www 는 apex 로 301. 안 넘기면 같은 문서가 두 호스트에서 200 으로 응답해
    # 색인이 갈리고 링크 신호도 쪼개진다. canonical 만으로는 힌트에 그친다.
    # server 컨텍스트의 if + return 은 nginx 가 권장하는 안전한 사용법이다.
    if ($host = www.haip.kr) {
        return 301 https://haip.kr$request_uri;
    }

    ssl_certificate /etc/letsencrypt/live/haip.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haip.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/haip/dist;
    index index.html;

    server_tokens off;

    # Cloudflare 프록시(주황 구름) 뒤에 있으면 $remote_addr 이 전부 Cloudflare 엣지 IP 로 찍힌다.
    # 접근 로그·향후 rate-limit 판단이 실제 방문자 IP 를 보게 real_ip 로 복원한다.
    # 목록 출처: https://www.cloudflare.com/ips/ — 바뀌면 여기도 같이 갱신할 것.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # 이미지, 영상, 문서는 저장소의 assets/ 를 그대로 쓴다 (dist 로 복사하지 않음)
    # ^~ 가 반드시 필요하다. 일반 prefix 로 두면 아래 확장자 regex 블록이 이겨서
    # root 가 dist 로 돌아가고 /assets/*.png 가 전부 404 가 된다.
    # 파비콘류는 파일명을 고정해 쓰므로 아래 immutable 규칙에서 빼둔다.
    # immutable 이 붙으면 브라우저가 일반 새로고침에서도 재검증하지 않아서,
    # 아이콘을 교체해도 기존 방문자는 만료(30일)까지 옛 아이콘을 본다.
    # regex(~*) 로는 안 된다 — 아래 `^~ /assets/` 가 regex 평가를 막는다.
    # exact match(=) 는 `^~` 보다 우선하므로 파일마다 하나씩 적는다.
    location = /assets/favicon.svg {
        root /var/www/haip;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }
    location = /assets/favicon.ico {
        root /var/www/haip;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }
    location = /assets/apple-touch-icon.png {
        root /var/www/haip;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    location ^~ /assets/ {
        root /var/www/haip;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # CSS, JS 는 dist 안에 빌드된 것을 쓴다. 파일명이 고정(해시 없음)이라 immutable 로 못 돌린다 —
    # 파비콘과 같은 이유(위 주석 참고). HTML(아래 .html 블록)과 같은 논리로 브라우저는 매번
    # 재검증, Cloudflare 엣지는 10분 보관해 재검증이 서울 엣지에서 끝나게 한다.
    # no-cache 대신 public, max-age=0 을 쓴다 — 브라우저 입장에선 매번 재검증으로 동일하지만,
    # 공유 캐시(Cloudflare) 입장에선 no-cache 를 "반드시 재검증"으로 보수적으로 해석해
    # bypass 로 빠지는 경우가 있다. public, max-age=0 은 "저장은 되는데 신선도가 0"이라
    # s-maxage 가 엣지 TTL 을 명확히 가져간다.
    # add_header 는 location 에 하나라도 있으면 server 레벨 지시자를 상속하지 않는다 —
    # 그래서 nosniff·HSTS 를 여기 다시 적는다. X-Frame-Options·Referrer-Policy 는
    # 문서 프레이밍·리퍼러 정책이라 CSS/JS 응답엔 의미가 없어 뺀다.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=0, s-maxage=600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # 방어선 하나 더 — dist 밖이라 닿을 일이 없지만 실수로 루트가 바뀌어도 막히게
    location ~ /\.                          { deny all; access_log off; log_not_found off; }
    location ~* \.(md|sh|py|conf|pem|key|ya?ml|log|bak|orig)$ { deny all; access_log off; log_not_found off; }

    # 구버전 URL — 예전에 쓰던 주소를 새 주소로 넘긴다.
    # meta refresh 스텁 파일 대신 301 로 처리한다 (신호가 제대로 넘어가고 루트도 깨끗하다)
    location = /brand-story.html      { return 301 /services.html#process; }
    location = /brand-story           { return 301 /services.html#process; }
    location = /insight-case.html     { return 301 /insight.html#case; }
    location = /insight-guide.html    { return 301 /insight.html#guide; }
    location = /insight-glossary.html { return 301 /insight/glossary/index.html; }
    location = /about.html      { return 301 /services.html; }
    location = /about           { return 301 /services.html; }

    gzip on;
    # text/html 은 nginx 가 항상 포함한다. 여기 적으면 중복 선언 경고가 난다.
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    location ~* \.html$ {
        # 브라우저는 매번 재검증, Cloudflare 엣지는 Cache Rule 로 s-maxage 만큼 보관.
        # s-maxage 를 origin 이 안 보내면 Cache Rule 의 "Respect origin" TTL 이 기준을 못 잡는다.
        # no-cache 대신 public, max-age=0 인 이유는 CSS/JS 블록 위 주석 참고 —
        # Cloudflare 가 no-cache 를 만나면 캐시 자체를 보수적으로 bypass 하는 경우가 있다.
        add_header Cache-Control "public, max-age=0, s-maxage=600" always;
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Strict-Transport-Security "max-age=31536000" always;
}
