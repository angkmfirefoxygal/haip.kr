# Nginx config for haip.kr
# 위치: /etc/nginx/conf.d/haip.conf
# 주의: 이 파일을 서버에 cp할 경우 nginx reload 필요
# 주의: certbot이 HTTPS 블록을 관리하므로, cp 후 certbot 설정이 덮어써질 수 있음
#
# 이 설정은 저장소를 그대로 웹 루트(/var/www/haip)에 두는 구조를 전제한다.
# 그래서 .git/ · CLAUDE.md · deploy.sh 같은 내부 파일을 명시적으로 막아야 한다.

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name haip.kr www.haip.kr;
    return 301 https://$host$request_uri;
}

# HTTPS (Let's Encrypt 인증서 적용됨)
server {
    listen 443 ssl http2;
    server_name haip.kr www.haip.kr;

    ssl_certificate /etc/letsencrypt/live/haip.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haip.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/haip;
    index index.html;

    # ------------------------------------------------------------------
    # 내부 파일 차단 (웹 루트가 곧 git 작업 디렉터리이므로 필수)
    # 이 블록들은 다른 location 보다 먼저 매칭되도록 위에 둔다.
    # ------------------------------------------------------------------
    # .git/, .gitignore 등 점으로 시작하는 모든 경로
    location ~ /\. { deny all; access_log off; log_not_found off; }

    # 내부 디렉터리
    location ^~ /nginx/  { deny all; access_log off; log_not_found off; }
    location ^~ /design/ { deny all; access_log off; log_not_found off; }

    # 문서·스크립트·설정 파일 확장자
    location ~* \.(md|sh|conf|pem|key|ya?ml|log|bak|orig)$ {
        deny all; access_log off; log_not_found off;
    }

    # Cloudflare Pages 전용 파일 (nginx 에서는 쓰지 않지만 저장소에는 있음)
    location ~* ^/_(headers|redirects)$ { deny all; access_log off; log_not_found off; }

    # ------------------------------------------------------------------
    # 구버전 URL 리다이렉트 (_redirects 파일의 nginx 판)
    # ------------------------------------------------------------------
    location = /about.html     { return 301 /services.html#process; }
    location = /about         { return 301 /services.html#process; }
    location = /portfolio.html { return 301 /services.html; }
    location = /portfolio     { return 301 /services.html; }

    # Gzip compression
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # HTML: 항상 최신 버전 확인
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # 이미지/폰트/영상/문서: 장기 캐시 (파일명이 바뀔 때만 갱신)
    location ~* \.(woff2?|png|jpg|jpeg|gif|svg|webp|ico|mp4|webm|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 각 html 파일을 확장자 없이도 접근 가능하게
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # 없는 주소는 우리 404 페이지로 (nginx 기본 페이지 대신)
    error_page 404 /404.html;
    location = /404.html { internal; }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Strict-Transport-Security "max-age=31536000" always;
}
